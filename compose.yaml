services:
  postgres:
    image: postgres:17-alpine
    container_name: kai-queueops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the Compose env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the Compose env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kai-queueops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  kai-queueops-postgres-data:
    name: kai-queueops-postgres-data
