apiVersion: batch/v1
kind: Job
metadata:
  name: kai-sample-cpu-pressure
  namespace: kai-queueops-test
  labels:
    app.kubernetes.io/name: kai-sample-cpu-pressure
    app.kubernetes.io/part-of: kai-queueops-workload-samples
    kai.scheduler/queue: model-training
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kai-sample-cpu-pressure
        app.kubernetes.io/part-of: kai-queueops-workload-samples
        kai.scheduler/queue: model-training
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      containers:
        - name: cpu-pressure
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/kai-samples/cpu_burn.py"]
          env:
            - name: CPU_WORKERS
              value: "4"
            - name: DURATION_SECONDS
              value: "600"
          resources:
            requests:
              cpu: "4"
              memory: 96Mi
            limits:
              cpu: "4"
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: samples
              mountPath: /opt/kai-samples
              readOnly: true
      volumes:
        - name: samples
          configMap:
            name: kai-python-workloads
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kai-sample-memory-pressure
  namespace: kai-queueops-test
  labels:
    app.kubernetes.io/name: kai-sample-memory-pressure
    app.kubernetes.io/part-of: kai-queueops-workload-samples
    kai.scheduler/queue: batch-evaluation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kai-sample-memory-pressure
        app.kubernetes.io/part-of: kai-queueops-workload-samples
        kai.scheduler/queue: batch-evaluation
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      containers:
        - name: memory-pressure
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/kai-samples/memory_pressure.py"]
          env:
            - name: MEMORY_MIB
              value: "768"
            - name: DURATION_SECONDS
              value: "600"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: samples
              mountPath: /opt/kai-samples
              readOnly: true
      volumes:
        - name: samples
          configMap:
            name: kai-python-workloads
